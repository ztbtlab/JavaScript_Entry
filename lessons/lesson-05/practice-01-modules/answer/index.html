<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>練習1（模範解答）: カウンターを 3 つのファイルに分ける</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main>
      <p><a href="../index.html">← 練習1（自分でやる方）に戻る</a></p>

      <h1>練習1（模範解答）</h1>
      <p>
        分けたあとの完成形。<strong>授業中は開かないこと</strong>（詰まった人だけ講師の許可のもとで参照）。
        分ける前と<strong>まったく同じ動き</strong>になっているのがポイント。
      </p>

      <div class="counter">
        <span class="counter-value" id="count" aria-live="polite">0</span>
        <div class="buttons">
          <button id="plus" type="button">＋1</button>
          <button id="minus" type="button">−1</button>
          <button id="reset" type="button">リセット</button>
        </div>
      </div>

      <div class="warn">
        <p>
          <strong>⚠️ Live Server で開くこと。</strong>
          ダブルクリックで開く（<code>file://</code>）と <code>import</code> が動かない。
        </p>
      </div>
    </main>

    <!-- type="module" があるので import が使える -->
    <script type="module" src="main.js"></script>
  </body>
</html>
