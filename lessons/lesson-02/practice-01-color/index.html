<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>練習1: ボタンで文字色を変える</title>
    <style>
      /* 見やすさ優先の最小スタイル */
      body {
        font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: #f7f7f7;
        color: #222;
        margin: 0;
        padding: 2rem 1rem;
        text-align: center;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      #title {
        font-size: 2rem;
        margin: 1rem 0 2rem;
      }
      button {
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
      }
      a {
        color: #2b6cb0;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="../index.html">← 第2回トップに戻る</a></p>

      <!-- ここの見出しを JS から色変更する。id="title" を目印にする。 -->
      <h1 id="title">このタイトルの色を変えてみよう</h1>

      <!-- ボタン。id="change-color" で JS から取る。 -->
      <button id="change-color" type="button">色を変える</button>
    </main>

    <!-- 自分で書くファイル。まずは main.js の TODO を埋める -->
    <script src="main.js"></script>
  </body>
</html>
