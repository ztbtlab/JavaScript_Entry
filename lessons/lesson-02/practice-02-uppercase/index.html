<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>練習2: 入力を大文字に変換</title>
    <style>
      body {
        font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: #f7f7f7;
        color: #222;
        margin: 0;
        padding: 2rem 1rem;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
      }
      #output {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #eef2f7;
        border-radius: 6px;
        font-size: 1.5rem;
        min-height: 1.8rem;
        font-family: "Menlo", "Consolas", monospace;
      }
      a {
        color: #2b6cb0;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="../index.html">← 第2回トップに戻る</a></p>

      <h1>入力を大文字に変換</h1>

      <label for="source">何か英語を入力してみて:</label>
      <!-- ここに入力された文字を JS で取る -->
      <input id="source" type="text" placeholder="例: hello world" />

      <!-- 変換結果をここに表示する -->
      <p>結果: <span id="output"></span></p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
