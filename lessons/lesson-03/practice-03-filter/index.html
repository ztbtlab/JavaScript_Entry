    <style>
      body {

      main {
        max-width: 620px;
        margin: 0 auto;
        background: #fff;

      h1 {
        font-size: 1.6rem;
      }
      .badge {
        display: inline-block;
        background: #fde68a;

        padding: 0.1rem 0.6rem;

        margin-left: 0.5rem;
      }
      code {
        background: #eef2f7;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;

      }

        margin-top: 1.5rem;

  <body>
    <main>
      <p><a href="../index.html">← 第3回トップに戻る</a></p>

      <h1>練習3: 気温配列を filter で絞り込む<span class="badge">発展 / 宿題</span></h1>
      <p>
        1 週間の気温（℃）の配列から、<code>filter</code> を使って
        <strong>25 度以上の「暑い日」だけ</strong>を取り出す。
      </p>
      <p>
        この練習は <strong>発展課題</strong>。早く終わった人は授業中に、それ以外の人は宿題として取り組もう。
        結果は下の枠と Console の両方に出す。
      </p>

      <label for="source">暑い日のしきい値を入力:</label>
      <input id="source" type="text" placeholder="例: 28" />

      <!-- ここに絞り込んだ結果を表示する。id="output" を目印にする。 -->
      <div id="output">（ここに結果が出ます）</div>
    </main>
