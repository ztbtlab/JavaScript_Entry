            ## 今日のテーマ: 「覚えさせる」

        <!-- 5. 状態とは -->
        <section data-markdown>
          <textarea data-template>
            ## 状態（state）とは

            **状態 = プログラムが「今どうなっているか」を覚えている値**

            - カウンター → 「今 3 回押された」
            - トグル → 「今は開いている」
            - フォーム → 「今 2 件登録した」

            ```js
            let count = 0; // ← これが状態。押されるたびに書き換わる
            ```

            <span class="sub">覚えておく場所は **変数**。書き換わるので `const` ではなく **`let`**。</span>

            Note:
            3 つの例は今日の練習1・2・3 にそのまま対応している。「今日の 3 問は全部これ」と先に言っておくと見通しが立つ。const にすると代入エラーになる、は必ず触れておく（巡回で必ず出る）。
          </textarea>
        </section>

        <!-- 6. Arduino 類推 -->
        <section data-markdown>
          <textarea data-template>
            ## Arduino と比べてみよう

            ボタンが押された回数を数えたいとき——

            | 書く場所 | Arduino | 結果 |
            |---|---|---|
            | `loop()` の **中** | `int count = 0;` | 毎回 0 に戻って数えられない |
            | `loop()` の **外** | `int count = 0;` | 値が残る = **状態** |

            JS も同じ。`addEventListener` に渡す関数の **中** で
            `let count = 0;` と書くと、クリックのたびに 0 に戻る。

            <span class="sub">**状態は関数の外に置く。** これが今日いちばん多いつまずき。</span>

            Note:
            今日の目玉。Arduino 経験者にはこの類推が一撃で効くので、必ず口に出す。ホワイトボードに loop の箱を描いて、外に置いた変数だけが生き残る絵を見せる。練習1 の巡回では全員分この位置を確認する。
          </textarea>
        </section>

        <!-- 7. 3 ステップの型 -->

            ## 今日ずっと使う「3 ステップ」

            ```js
            ① 状態を持つ          let count = 0;
            ② イベントで状態を変える  count = count + 1;
            ③ 画面を描き直す        countLabel.innerText = ____;
            ```

            <span class="spacer"></span>

            **②と③は別の仕事。**

            <span class="sub">「変数は変わったのに画面が変わらない」は、③を忘れているだけ。</span>

            Note:
            ここで「変数だけ変えて画面を更新しない」コードをわざと 1 回デモして見せる。押しても何も起きない → Console で count を出すと増えている → ③の必要性が体で分かる。この実演は省略しないこと。
          </textarea>
        </section>

        <!-- 8. 表示更新は関数にまとめる -->
        <section data-markdown>
          <textarea data-template>
            ## 表示更新は「関数」にまとめる（第3回の応用）

            ③を毎回書くと散らかる → **名前を付けて 1 か所に**

            ```js
            function showCount() {
              countLabel.innerText = ____; // 状態を画面に映すのが仕事
            }
            ```

            - 状態を変えたら、**必ず** `showCount()` を呼ぶ
            - 「増やす」「減らす」「リセット」がいくつ増えても、
              **画面を書き換える場所は 1 か所だけ**

            <span class="sub">第3回でやった「処理に名前を付ける」が、そのまま効いてくる。</span>

            Note:
            穴は生徒に埋めさせる（答えは言わない）。ここで「宿題でボタンを 2 つ足すけど、この関数は 1 つのままでいい」と予告しておくと、関数にまとめる御利益が最後に回収できる。
          </textarea>
        </section>

        <!-- 9. 変数が正、画面はコピー -->
        <section data-markdown>
          <textarea data-template>
            ## 変数が「正」、画面はそのコピー

            - 画面の文字（`innerText`）を **読んで計算しない**
            - 本物は変数 `count`。画面はそれを映しただけ

            ```js
            countLabel.innerText + 1  // "3" + 1 → "31" ← 事故
            count + 1                 // 3 + 1 → 4    ← 正しい
            ```

            <span class="sub">画面から取り出した文字は **必ず文字列**。数として足すと「くっつく」。</span>

            Note:
            ホワイトボードの矢印は「状態 → 画面」の一方通行だけ描き、画面から状態へ戻る矢印は描かない。それがこのルールの絵解きになる。"31" は実際に Console で見せると強烈に効く。
          </textarea>
        </section>

        <!-- 14. ミニ講義: クラスは見た目の名札 -->
        <section data-markdown>
          <textarea data-template>
            ## クラス = 見た目の「名札」

            CSS 側で「この名札が付いていたら、こう見せる」を決めておく。

            ```css
            .hidden {
              display: none; /* 名札が付いたら消える */
            }
            ```

            JS 側はその名札を **付けたり外したり** するだけ。

            <span class="sub">色や `display` を JS から直接書くより、ずっと整理しやすい。</span>

            Note:
            「見た目の決定は CSS、切り替えの判断は JS」という役割分担を先に言う。style.css には .hidden を用意済みなので、生徒は CSS を書かなくてよいと明言しておく。
          </textarea>
        </section>

        <!-- 15. classList 板書キーワード -->
        <section data-markdown>
          <textarea data-template>
            ## add / remove / toggle（板書）

            ```js
            要素.classList.add("クラス名");    // 名札を付ける
            要素.classList.remove("クラス名"); // 名札を外す
            要素.classList.toggle("クラス名"); // 付いてたら外す、無ければ付ける
            ```

            - **`toggle`（トグル）= 押すたびに交互に切り替える**
            - 渡すのは **`"hidden"`**。CSS で書く `.` は **付けない**
            - Arduino の `ledState = !ledState;`（今の状態をひっくり返す）の DOM 版

            <span class="sub">`class` は HTML の書き方。JS 側の窓口は `classList`。</span>

            Note:
            `.hidden` と書いて動かない、が定番ミス。ここで 1 回口に出しておくと練習2 の巡回が楽になる。LED の点滅トグルの類推は Arduino 経験者に効くので忘れず言う。
          </textarea>
        </section>
