    <div class="reveal">
      <div class="slides">

        <!-- 1. 表紙 -->
        <section data-markdown class="title-slide">
          <textarea data-template>
            # 第5回 モジュール分割と PR
            ## ファイルを分ける・ブランチから PR を出す

            - 所要時間: **2 時間**
            - 今日の練習: **2 問 ＋ 発展1問（宿題）**
            - **講座前半のマイルストーン回**

            Note:
            第1回から第4回までで「ブラウザで動く小アプリ」は作れるようになった。今日はそれを「人に見せて取り込んでもらう」ところまで進める節目の回。新しい文法は少ない代わりに、手順を自分の手で 1 周させるのが主役だと最初に宣言する。緊張している子には「今日は覚えることより、やってみる回」と一言。
          </textarea>
        </section>

        <!-- 2. 今日のゴール -->
        <section data-markdown>
          <textarea data-template>
            ## 今日のゴール

            1. 1 つの `main.js` を **`logic.js`（計算）/ `ui.js`（画面）/ `main.js`（司令塔）** に分けられる
            2. **`export` / `import`** と **`<script type="module">`** を書ける
            3. **自分でブランチ（枝）を作って PR を出せる**
            4. 講師のレビューに **1 回対応して push** できる

            > 🏁 **今日は講座前半のマイルストーン。**
            > 「PR を 1 本出せた」で今日は合格。

            Note:
            ゴール3・4 がマイルストーン判定。ここを最優先だと最初に明言しておく。練習1（分割）が終わらない子がいても、練習2 には全員を必ず乗せる。「全員が PR を 1 本出す」を今日の合言葉にする。
          </textarea>
        </section>

        <!-- 3. 前回の振り返り -->
        <section data-markdown>
          <textarea data-template>
            ## 前回の振り返り（口頭クイズ＋宿題紹介）

            - 宿題（カウンターに **リセット** と **5 ずつ増やす** を追加）を **1 人 1 分** で紹介
            - 「**状態**」って何のことだった？
            - ボタンを押してから画面が変わるまでに、何が起きている？
            - 第3回の**関数**は何のためだった？

            <span class="sub">※ 15 分を超えない。宿題が出せていなくても責めない。</span>

            Note:
            答えの目安。状態＝いまの値を覚えている変数（カウンターなら count）。押してから画面が変わるまで＝状態を更新 → 画面に反映。関数＝処理に名前を付けて使い回す。第4回のカウンター main.js を投影して「1 ファイルに全部入っているね」と確認させ、そのまま今日の入り口へつなぐ。
          </textarea>
        </section>

        <!-- 4. なぜ分ける？ -->
        <section data-markdown>
          <textarea data-template>
            ## なぜファイルを分ける？

            前回のカウンター `main.js` には、**2 種類の仕事**が混ざっている。

            - **計算の仕事**: `count + 1` を作る / 0 に戻す
            - **画面の仕事**: `document.getElementById(...)` / `innerText` を書き換える

            <span class="sub">考えることが別なら、ファイルも別にしよう。</span>

            > 🔧 Arduino で言うと…
            > スケッチが長くなると、**センサーを読む部分**と **LED を光らせる部分**が
            > ごちゃ混ぜになって、どこを直せばいいか分からなくなる。あれと同じ。

            Note:
            第4回 practice-01-counter の main.js を投影し、計算の行と画面の行を色分けしながら読む。「これがあと 10 倍長くなったら、直したい場所を探せる？」と問いかけてから次のスライドへ。文法（export / import）はまだ出さない。動機づけを先に。
          </textarea>
        </section>

        <!-- 5. 分けると嬉しいこと / 3 つの箱 -->
        <section data-markdown>
          <textarea data-template>
            ## 今日は「3 つの箱」に分ける

            ```
                        main.js（司令塔）
                     let count = 0;  状態はここ
                          │        │
                 呼ぶ ←──┘        └──→ 呼ぶ
                  │                        │
            logic.js（計算）          ui.js（画面）
            document を書かない        計算をしない
            ```

            **分けると嬉しいこと 3 つ**

            1. 直したい場所をすぐ探せる
            2. 計算だけ取り出して確認できる（画面が無くても試せる）
            3. 何人かで作るとき、**別々のファイルを担当できる** → 今日の後半の PR につながる

            Note:
            ホワイトボードにも同じ 3 つの箱を描き、main.js から両方へ矢印を伸ばす。矢印の向き（main が呼ぶ側）を強調。Arduino 類推:「センサーを読む関数」「LED を光らせる関数」を loop() が呼ぶ構造と同じ。main.js が loop() に相当する。嬉しいこと 3 つめが後半の伏線。
          </textarea>
        </section>

        <!-- 6. logic.js -->
        <section data-markdown>
          <textarea data-template>
            ## logic.js（計算担当）

            `export` を付けると「**他のファイルに貸し出す**」印になる。

            ```js
            // logic.js — 計算だけ。画面のことは何も知らない
            ______ function increment(count) {
              return count ____ 1;
            }

            ______ function decrement(count) { ... }
            ______ function reset() { ... }   // 引数はいらない
            ```

            <span class="sub">目印: `logic.js` に `document` が **1 回も出てこない**。出てきたら分け方を間違えている合図。</span>

            Note:
            引数で今の値を受け取り、return で新しい値を返す＝第3回の関数の形そのまま。reset に引数がいらない理由（いまの値を使わず 0 を返すだけ）は必ず口頭で確認する。穴は生徒に当てて答えさせてよいが、コードは練習1 で自分の手で書かせる。ここでは打ち込ませない。
          </textarea>
        </section>

        <!-- 7. ui.js -->
        <section data-markdown>
          <textarea data-template>
            ## ui.js（画面担当）

            ```js
            // ui.js — 画面に出すことだけ。計算はしない
            const countLabel = document.getElementById("_____");

            ______ function showCount(value) {
              countLabel.innerText = _____; // 渡された値を映すだけ
            }
            ```

            > ⚠️ **第4回からの変化**
            > 前回の `showCount()` は**引数なし**で、外の `count` を直接読んでいた。
            > 分けると `count` は別ファイル。だから **`showCount(value)`** と引数で受け取る。

            <span class="sub">`count` は**数そのもの**、`countLabel` は**数を出す場所**。名前が似ているので注意。</span>

            Note:
            今日いちばん質問が出るところ。「ファイルをまたぐときは、変数を直接見ずに引数で渡す」が今日の考え方だと言い切る。画面に undefined が出たら showCount() を引数なしで呼んでいる合図、と先に予告しておくと巡回が楽になる。id="count" と変数 countLabel の使い分けもここで 1 回押さえる。
          </textarea>
        </section>

        <!-- 8. main.js -->
        <section data-markdown>
          <textarea data-template>
            ## main.js（司令塔）

            ```js
            ______ { increment, decrement, reset } from "____logic.js";
            ______ { showCount } from "./ui.___";

            let count = 0; // 状態はここが持つ（第4回と同じ）

            plusButton.addEventListener("click", () => {
              count = increment(count); // 計算は logic に頼む
              showCount(count);         // 画面は ui に頼む
            });
            ```

            <span class="sub">`import { 名前 } from "./ファイル名.js";` — **波カッコ**・**`./`**・**`.js`** の 3 つを忘れやすい。</span>

            Note:
            「export で貸し出して、import で借りてくる」と言い換える。状態（let count = 0;）は分けたあとも main.js が持つ、logic.js には置かない、を強調。−1 とリセットも同じ形になることは口頭で補う（スライドには載せず、練習1 で自分で書かせる）。
          </textarea>
        </section>

        <!-- 9. type="module" -->
        <section data-markdown>
          <textarea data-template>
            ## 今日の最重要の 1 行

            ```html
            <!-- これまで -->
            <script src="main.js"></script>

            <!-- 今日から -->
            <script ____="______" src="main.js"></script>
            ```

            - これを付けて**初めて `import` が使えるようになる**
            - 忘れると、`import` の行でエラーになる
            - `defer` と同じく「HTML を読み終わってから実行」→ **`defer` は書かなくてよい**

            <span class="sub">合言葉: **「`import` を書いたら `type="module"`」はセット**。</span>

            Note:
            この 1 行は板書に残したまま授業を進める（講師用チェックリスト）。練習1 の index.html の TODO 4 がまさにここ。分ける前の main.js はこの属性が無くても動くので、import を書いた瞬間に必要になる、という順番を説明しておくと生徒が納得しやすい。
          </textarea>
        </section>

        <!-- 10. file:// の落とし穴 -->
        <section data-markdown>
          <textarea data-template>
            ## ⚠️ ダブルクリックで開くと動かない

            `index.html` をダブルクリック（アドレスが `file://`）で開くと、Console にこれが出る。

            ```
            Access to script at 'file:///.../logic.js' from origin 'null'
            has been blocked by CORS policy
            ```

            - ブラウザが安全のため、**ファイルを直接開いた状態では別ファイルの読み込みを禁止**している
              （**CORS**＝コルス。読んでよいか決めるブラウザの安全ルール）
            - **必ず Live Server で開く**: `index.html` を右クリック → **Open with Live Server**
            - アドレスが `http://127.0.0.1:5500/...` になっていれば OK

            Note:
            ここは**わざと一度 file:// で開いてエラーを見せる**。「このエラーが出たら Live Server で開き直す」を体で覚えさせるのが、後半の質問対応を減らす近道。CORS の中身は深追いしない。中2にはここまでで十分。授業前に全員の VS Code に Live Server 拡張が入っているかも確認しておく。
          </textarea>
        </section>

        <!-- 11. モジュールの中は外から見えない -->
        <section data-markdown>
          <textarea data-template>
            ## もう 1 つの変化: 中の変数は外から見えない

            `type="module"` にすると、そのファイルで作った変数は**ファイルの中だけのもの**になる。

            ```js
            // DevTools の Console に count と打つと…
            Uncaught ReferenceError: count is not defined
            ```

            - これまでは Console から見えていた。**これで正常**
            - 中身を見たいときは、コードの中に `console.log(count);` を書く
            - 不便なのではなく**安全のため**（他のファイルと名前がぶつからない）

            Note:
            第4回まで Console で count を直接叩いて確認していた子が必ず混乱する。「壊れたのではなく仕様」と先に言っておく。console.log を書いて確かめる習慣は Arduino の Serial.println と同じ、と結びつけると通じる。
          </textarea>
        </section>

        <!-- 12. 板書キーワード（前半） -->
        <section data-markdown>
          <textarea data-template>
            ## 前半の板書キーワード

            ```
            1 ファイルに全部 → 役割で分ける
              logic.js = 計算（document を書かない）
              ui.js    = 画面（計算しない）
              main.js  = 状態を持ち、2 つをつなぐ司令塔

            export function 名前() {...}          ← 貸し出す
            import { 名前 } from "./logic.js";    ← 借りてくる（./ と .js）

            <script type="module" src="main.js"></script>  ← 無いと import 不可
            file:// で開くと動かない → Live Server（http://127.0.0.1:5500/...）
            ```

            Note:
            このブロックは板書に残し、練習1 の間ずっと参照させる。生徒用ノート（student-note.md）の 1〜3 節と同じ内容。ここから演習なので、詰まったらこのページに戻る合図にする。
          </textarea>
        </section>

        <!-- 13. 練習1 問題 -->
        <section data-markdown>
          <textarea data-template>
            ## 練習1: カウンターを 3 つのファイルに分ける

            [practice-01-modules](../practice-01-modules/) を開く

            - 配布の `main.js` は **そのままでも動く**。まず Live Server で開いて
              ＋1 / −1 / リセットが効くことを確かめてから分け始める
            - **完成条件: 分ける前とまったく同じ動き**。**動きが変わらないのが正解**

            <ul class="tags" aria-label="キーワード">
              <li>increment</li>
              <li>decrement</li>
              <li>reset</li>
              <li>showCount</li>
              <li>export / import</li>
            </ul>

            Note:
            「動きが変わらないのが正解」は必ず声に出す。見た目が変わらないので達成感が薄い子がいる。まず動くことを確認してから壊す（分ける）という順番を守らせると、失敗したときに戻れる。ボタンは 3 つ固定。「5 ずつ増やす」は発展扱いで配布ファイルには入っていない。
          </textarea>
        </section>

        <!-- 14. 練習1 ヒント -->
        <section data-markdown>
          <textarea data-template>
            ## 練習1 ヒント（一気に全部移さない）

            1. **`logic.js` に `increment` を 1 つだけ**移す → `import` して ＋1 が動くか確かめる（TODO 1・3）
            2. 動いたら `decrement` / `reset` も同じように移す
            3. 画面の書き換えを `ui.js` の **`showCount(value)`** に移す（TODO 2）
               <span class="sub">前回は引数なし。今回は**値を渡す形**</span>
            4. `index.html` の `<script>` に `type="module"` を足す（TODO 4）
            5. 仕上げに `logic.js` を読み返して `document` が無いか確かめる

            <span class="sub">引っ越し**元**の行が `main.js` に残っていないかも確認（TODO 3-3）。二重にあると混乱のもと。</span>

            Note:
            main.js の TODO 3-1（import）・3-2（中身の書き換え）・3-3（引っ越し元を消す）に対応。「1 つ移して動かす → 次を移す」の順がいちばん早く終わる。早く終わった子には logic.js に incrementBy(count, amount) を足して「5 ずつ増やす」ボタンを付ける発展を渡す。
          </textarea>
        </section>

        <!-- 15. 巡回チェック 3 点 -->
        <section data-markdown>
          <textarea data-template>
            ## 動かない！ と思ったら、この 3 つ

            1. **アドレス欄**が `http://127.0.0.1:...` になっている？
               （`file://` なら Live Server で開き直す）
            2. `<script>` に **`type="module"`** が付いている？
            3. **Console のエラー 1 行目**を読む（全部読まなくていい）

            <span class="spacer"></span>

            <span class="sub">この 3 つで大半は解決する。それでもダメなら講師を呼ぶ。</span>

            Note:
            巡回時もこの順で確認する。生徒には「エラーは全部読まなくていい、1 行目だけ教えて」と徹底させると、質問対応が一気に速くなる。ここまでで 1 時間。休憩を挟んで後半の PR 実習へ。
          </textarea>
        </section>

        <!-- 16. 休憩 -->
        <section data-markdown class="title-slide">
          <textarea data-template>
            # 休憩 10 分

            後半は **ブランチと PR**。

            <span class="sub">戻ってきたら、VS Code で GitHub にサインインできているか確認します。</span>

            ## なぜブランチ（枝）を使う？

            - `main`（本線）は「**いつでもちゃんと動く状態**」を保ちたい場所
            - でも新しい機能を作っている途中は、動かない時間がある
            - その途中経過を `main` に置きたくない

            **ブランチ（枝）= 本線を壊さずに作業するためのコピー**

            > 🔧 Arduino で言うと…
            > **動いている回路はそのままにして、別のブレッドボードで試す**。
            > うまくいったら本番の回路に反映する。

            Note:
            この Arduino 類推は講師用チェックリストの必須項目。1 回は口に出す。ここは文法ではなく手順の話なので、コマンドより先に「なぜそうするか」を通しておく。次のスライドの流れ図が後半の主役。

        <section data-markdown>
          <textarea data-template>
            ## 覚えるコマンドは 3 つだけ

            ```bash
            git switch __ feature/lesson-05-xx      # ① 枝を作って移動
            git ___ .                                # ② 変更を選ぶ（第1回で既習）
            git commit -m "#__ profile を更新"       # ② メッセージを付けて保存
            git push __ origin feature/lesson-05-xx  # ③ GitHub に送る
            ```

            > **ヒント枠**（`steps.md` にも同じものがある）
            > - `-c` … 「新しく作る」の印（**c**reate の c）。作るときだけ付ける
            > - `-u` … 「この枝の送り先はここ」と教える印。**初回だけ**（2 回目以降は `git push` だけ）
            > - `#__` … 練習2 の **Issue 番号**を入れる

            <span class="sub">いまどの枝にいるかは `git branch`、または VS Code の左下でも見える。</span>

            Note:
            埋めるのは生徒の仕事。ここでは意味だけ渡し、答えは口で言わない。`git switch` は第1回で扱っていない新コマンドなので、名前だけは板書する。ブランチ名の記号（xx）は講師が配る。Issue 番号も黒板に出しておく。

        <!-- 20. PR とは -->
        <section data-markdown>
          <textarea data-template>
            ## PR（プルリクエスト）って何？

            日本語にすると「**この変更を本線に入れてください、という依頼**」。

            - **タイトル**: 何をしたか 1 行
            - **説明**: なぜ・どう変えたか（**2 行でいい**）
            - 説明に `#XX`（Issue 番号）を書くと、その課題と自動でつながる
            - PR は**メッセージのやり取りができる場所**。迷ったところを書いてよい

            > ⚠️ このリポジトリは **Public（世界中から読める）**。
            > PR のタイトル・説明・コミットメッセージに
            > **本名・学校名・住所は書かない**。

            Note:
            Public リポの注意は、PR 作成前に必ず 1 回口に出す（講師用チェックリスト）。今回は生徒が初めて GitHub に文章を書く回。「書いた文章は消しても検索に残ることがある」まで言ってよい。PR の説明は「何を変えたか」「どこで迷ったか」の 2 行で十分だと安心させる。
          </textarea>
        </section>

            - 直したら、**同じブランチで** `commit` → `push` するだけ

            > ❗ **PR は自動で最新になる。作り直さなくていい。**
