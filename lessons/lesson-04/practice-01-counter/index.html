<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>練習1: カウンター</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p><a href="../index.html">← 第4回トップに戻る</a></p>

      <h1>練習1: カウンター</h1>
      <p>
        ボタンを押した回数を、プログラムに<strong>覚えさせる</strong>練習。
        覚えている値が <strong>状態</strong>、それを画面に映すのが <code>showCount()</code>。
      </p>

      <!-- 状態 count を映す場所。JS からは countLabel という名前で扱う -->
      <p class="counter">
        <!-- 最初は「-」。showCount() が呼ばれて初めて数に変わる -->
        <span id="count" aria-live="polite">-</span>
      </p>

      <div class="buttons">
        <button id="minus" type="button">-1</button>
        <button id="plus" type="button">+1</button>
      </div>

      <div class="note">
        <p><strong>完成の目安</strong></p>
        <ul>
          <li><code>+1</code> を押すと数が増える</li>
          <li><code>-1</code> を押すと数が減る</li>
          <li>何回連続で押しても、ちゃんと続きから増減する（0 に戻らない）</li>
        </ul>
        <p>
          編集するのは <code>main.js</code> だけ。数が動かないときは
          <code>F12</code>（Mac は <code>⌘ + Option + I</code>）で DevTools の Console を開こう。
        </p>
      </div>
    </main>

    <!-- 自分で書くファイル。main.js の TODO を埋める -->
    <script src="main.js"></script>
  </body>
</html>
