      <h1>ミックス クイズ（模範解答）</h1>
      <p>
        完成形の動き。まず自分で作ってみて、詰まったときだけ中身を読むこと。
        <strong>問題の中身は自由</strong>なので、同じでなくてよい。
      </p>

      <div class="quiz">
        <span class="question" id="question">（ここに問題文が出る）</span>

        <div class="choices">
          <button id="choice0" type="button">選択肢 1</button>

        <span class="result" id="result" aria-live="polite"></span>

        <div class="next">
          <button id="next" type="button">次の問題へ</button>
        </div>
      </div>

      <div class="warn">
        <p>
          <strong>⚠️ Live Server で開くこと。</strong>
          ダブルクリック（<code>file://</code>）では <code>import</code> が動かない。
