<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>練習3: ラジオで挨拶切替</title>
    <style>
      body {
        font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        background: #f7f7f7;
        color: #222;
        margin: 0;
        padding: 2rem 1rem;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      fieldset {
        border: 1px solid #ccc;
        padding: 1rem;
        border-radius: 6px;
      }
      label {
        margin-right: 1rem;
      }
      #greeting {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #eef2f7;
        border-radius: 6px;
        font-size: 1.6rem;
        min-height: 2rem;
        text-align: center;
      }
      a {
        color: #2b6cb0;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="../index.html">← 第2回トップに戻る</a></p>

      <h1>ラジオで挨拶切替</h1>
      <p>時間帯を選ぶと、対応する挨拶が出るようにしよう。</p>

      <fieldset>
        <legend>今はいつ？</legend>
        <!-- name を揃えることで「この 3 つは 1 グループ」になる -->
        <label><input type="radio" name="time" value="morning" checked /> 朝</label>
        <label><input type="radio" name="time" value="noon" /> 昼</label>
        <label><input type="radio" name="time" value="night" /> 夜</label>
      </fieldset>

      <!-- ここに挨拶を表示する -->
      <p id="greeting"></p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
