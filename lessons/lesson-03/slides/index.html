            ## なぜ「関数」で整理する？

        <!-- 5. 関数の基本（引数・戻り値） -->
        <section data-markdown>
          <textarea data-template>
            ## 関数の基本（入口と出口）

            - **引数（ひきすう）= 入口**。関数に渡すデータ
            - **戻り値（もどりち）= 出口**。`return` で返すデータ

            ```js
            function calcTotal(price, count) {
              return price * count; // ← return が出口
            }

            const total = calcTotal(120, 3); // 呼び出して受け取る
            console.log(total); // 360
            ```

            <span class="sub">`return` を忘れると `undefined`（値が無い）になる。今日の最頻出ミス。</span>

            Note:
            「入口（引数）→ 処理 → 出口（return）」をホワイトボードに箱の絵で描く。return 忘れ＝出口がない＝何も返らない、を体で覚えさせる。関数は「作っただけ」では動かない、呼び出して初めて動く、も強調。
          </textarea>
        </section>

        <!-- 6. 関数宣言 vs アロー関数 -->
        <section data-markdown>
          <textarea data-template>
            ## 関数宣言 vs アロー関数

            同じことの **2 つの書き方**。

            ```js
            // function 版
            function applyTax(amount) {
              return Math.floor(amount * 1.1);
            }

            // アロー関数版（同じ意味）
            const applyTax = (amount) => Math.floor(amount * 1.1);
            ```

            <span class="sub">今は「`function` の短い書き方」でOK。`=>`（矢印）と `>=`（以上）は別物。</span>

            Note:
            アロー関数は深入りしない。「短く書けて、map/filter に渡すとき便利」とだけ伝え、後の演習で体感させる。=> と >= の取り違えは中2で起きやすいので一度釘を刺す。
          </textarea>
        </section>

        <!-- 7. Arduino 類推 -->
        <section data-markdown>
          <textarea data-template>
            ## Arduino と比べてみよう

            - Arduino は `void setup()` / `void loop()` という **関数の枠** に処理を書いた
            - JS も「やることに名前を付けて関数にまとめる」のは同じ発想

            | | Arduino の関数 | JS の関数 |
            |---|---|---|
            | 値を受け取る | あまりしない | **引数で受け取る** |
            | 値を返す | `void` は返さない | **`return` で返せる** |

            <span class="sub">JS の関数は「入れて、返す」がしっかりできる。</span>

            Note:
            Arduino 経験者には「setup/loop も関数だったよね」が刺さる。引数・戻り値を使う点が新しい、と差分を明示すると理解が進む。
          </textarea>
        </section>

        <!-- 8. 配列 + map -->
        <section data-markdown>
          <textarea data-template>
            ## 配列を「まとめて変換」: map

            - 配列 = 値をまとめた箱 `[12, 8, 30]`
            - **`map`** = 全部を 1 個ずつ変換して、**新しい配列** を返す

            ```js
            const distancesCm = [12, 8, 30];
            const distancesMm = distancesCm.map((cm) => cm * 10);
            console.log(distancesMm); // [120, 80, 300]
            ```

            <span class="sub">個数は変わらない（3個→3個）。元の配列はそのまま。map に渡すのは「関数」。</span>

            Note:
            map の中に渡しているのが、さっき習ったアロー関数。「ここで関数が役に立つ」と回収する。「新しい配列を返すので、受け取らないと消える」「元の配列は変わらない」を必ず言う。
          </textarea>
        </section>

        <!-- 9. filter + reduce 紹介 -->
        <section data-markdown>
          <textarea data-template>
            ## 配列を「条件で残す」: filter

            - **`filter`** = 条件に合うものだけ残して、**新しい配列** を返す
            - 渡す関数は **`true` / `false`** を返す。`true` のものだけ残る

            ```js
            const temps = [18, 26, 30, 22];
            const hotDays = temps.filter((temp) => temp >= 25);
            console.log(hotDays); // [26, 30]
            ```

            <span class="sub">個数は減ることがある（4個→2個）。`reduce`（まとめる）もあるが今日は名前だけ。</span>

            Note:
            filter のコールバックは true/false を返す、が最大のポイント。「変換じゃない、残すか残さないか」を強調。reduce は「合計などにまとめるのもある」と一言だけ。深入り禁止。
          </textarea>
        </section>

        <!-- 10. map と filter の違い（板書） -->
        <section data-markdown>

            ## 今日の道具（板書キーワード）

            ```js
            // 関数（入口→処理→return で出口）
            function calcTotal(price, count) { return price * count; }
            const applyTax = (amount) => Math.floor(amount * 1.1);

            // 全部を変換（個数そのまま）
            const mm = cm.map((x) => x * 10);

            // 条件で残す（個数が減る）
            const hot = temps.filter((x) => x >= 25);
            ```

            | | map | filter |
            |---|---|---|
            | 個数 | 変わらない | 減ることがある |
            | 渡す関数 | 変換後の値 | true / false |

        <!-- 18. つまずいたら -->
        <section data-markdown>
          <textarea data-template>
            ## つまずいたら、まずここ

            - **DevTools Console を開く**（`F12` / `⌘+Option+I`）
            - `undefined` が出た → 関数の **`return` 忘れ**
            - `map` / `filter` の結果が消える → **変数で受け取り忘れ**
            - `filter` で全部残る／全部消える → 条件（`>=`）や `return` を確認

            ```js
            const total = calcTotal(120, 3);
            console.log("total:", total); // undefined なら return 忘れ
            ```

            <span class="sub">Arduino の `Serial.println` と同じ役割。出す習慣を付ける。</span>
